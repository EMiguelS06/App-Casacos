<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>O que visto?</title>
<link rel="apple-touch-icon" href="./icon.png">
<style>
:root{--ink:#17262b;--spruce:#24473f;--fog:#eef1ee;--paper:#fbfcfa;--line:#cfd8d3;--amber:#b8741a;--rain:#2f5f8a;--mute:#5b6b66;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--fog);color:var(--ink);font:16px/1.45 "Avenir Next","Segoe UI",system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:640px;margin:0 auto;padding:14px 16px 40px}
.top{max-width:640px;margin:0 auto}
.banner{position:relative;height:176px;overflow:hidden;border-radius:0 0 24px 24px;background:linear-gradient(#e3eae3,#a9c0b3)}
.banner svg{position:absolute;inset:0;width:100%;height:100%}
.banner h1{position:absolute;left:18px;bottom:14px;margin:0;font-size:30px;font-weight:800;letter-spacing:-.02em;color:var(--fog)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--rain);outline-offset:2px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 16px 0}
nav.tabs button{border-radius:14px;min-height:48px;font-weight:700;padding:10px 8px}
.tabs button,.seg button,.chip{border:1px solid var(--line);background:var(--paper);padding:8px 14px;border-radius:999px;min-height:40px}
.tabs button[aria-pressed=true],.seg button[aria-pressed=true],.chip[aria-pressed=true]{background:var(--spruce);color:var(--fog);border-color:var(--spruce)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;align-items:center}
.seg{display:flex;gap:6px}
.seg.g2,.seg.g3{display:grid;margin:10px 0}
.seg.g2{grid-template-columns:1fr 1fr}
.seg.g3{grid-template-columns:repeat(3,1fr)}
label{font-size:14px;color:var(--mute);display:flex;flex-direction:column;gap:3px}
select,input{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 10px;min-height:40px}
.hero{background:var(--spruce);color:var(--fog);border-radius:20px;padding:22px 20px;margin:14px 0}
.hero small{opacity:.8;font-size:14px}
.hero h2{font-size:34px;line-height:1.05;margin:8px 0 4px;letter-spacing:-.02em;font-weight:800}
.hero p{margin:4px 0;font-size:18px}
.hero .warn{margin-top:14px;background:rgba(255,255,255,.12);border-radius:12px;padding:10px 12px;font-size:15px}
dl{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0}
dl>div{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
dt{font-size:13px;color:var(--mute)}
dd{margin:0;font-size:20px;font-weight:700}
dd+dd{font-size:13px;font-weight:400;color:var(--mute);margin-top:2px}
h3{font-size:16px;margin:22px 0 8px}
.alt{padding:10px 12px;border-left:3px solid var(--line);margin:6px 0;color:var(--mute)}
.strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
.cell{flex:0 0 66px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px 6px;text-align:center;font-size:13px}
.cell b{display:block;font-size:18px}
.cell.wet{border-color:var(--rain);color:var(--rain)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0}
.card.err{border-color:var(--amber)}
.piece{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.piece p{margin:2px 0;font-size:14px;color:var(--mute)}
.mini{border:0;background:none;color:var(--rain);padding:6px;min-height:36px;text-decoration:underline}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{background:var(--spruce);color:var(--fog);border:0;border-radius:12px;padding:10px 16px;min-height:44px}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
[hidden]{display:none!important}
</style>
</head>
<body>
<header class="top">
  <div class="banner">
    <svg viewBox="0 0 640 180" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
      <defs>
        <path id="pine" d="M0-40L11-20H5L15-2H7L19 24H-19L-7-2H-15L-5-20H-11Z M-3 24H3V32H-3Z"/>
        <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#10211d" stop-opacity="0"/><stop offset="1" stop-color="#10211d" stop-opacity=".85"/></linearGradient>
      </defs>
      <g id="trees"></g>
      <rect y="100" width="640" height="80" fill="url(#shade)"/>
    </svg>
    <h1>O que visto?</h1>
  </div>
  <nav class="tabs"><button data-a="tab" data-v="today" aria-pressed="true">Previsão</button><button data-a="tab" data-v="ward" aria-pressed="false">Guarda-roupa</button></nav>
</header>

<main id="v-today">
  <div class="seg g2" id="dayseg"><button data-a="day" data-v="0">Hoje</button><button data-a="day" data-v="1">Amanhã</button></div>
  <div class="seg g3" id="chips">
    <button class="chip" data-a="per" data-v="0">Manhã</button>
    <button class="chip" data-a="per" data-v="1">Tarde</button>
    <button class="chip" data-a="per" data-v="2">Noite</button>
  </div>
  <div class="row">
    <label>Das <select id="from"></select></label>
    <label>às <select id="to"></select></label>
    <label>Local <select id="loc"></select></label>
    <button class="mini" data-a="gps">Usar a minha localização</button>
  </div>
  <div class="seg g2"><button data-a="mode" data-v="c">Casual</button><button data-a="mode" data-v="f">Formal</button></div>
  <div id="out"></div>
</main>

<main id="v-ward" hidden>
  <div id="list"></div>
  <h3 id="ftitle">Adicionar peça</h3>
  <div class="card">
    <div class="grid2">
      <label>Nome <input id="fn"></label>
      <label>Tipo <select id="ft"><option value="o">Camada exterior</option><option value="m">Camada média</option></select></label>
      <label>Conforto desde (°C) <input id="flo" type="number" step="1"></label>
      <label>Conforto até (°C) <input id="fhi" type="number" step="1"></label>
      <label>Corta o vento <select id="fw"><option value="0">Não</option><option value="1">Parcialmente</option><option value="2">Sim</option></select></label>
      <label>Chuva <select id="fr"><option value="0">Nada</option><option value="1">Chuvisco</option><option value="2">Normal</option><option value="3">Robusta</option></select></label>
      <label>Formalidade <select id="ff"><option value="1">1, só casual</option><option value="2">2, serve nos dois</option><option value="3">3, só formal</option></select></label>
    </div>
    <div class="row"><button class="btn" data-a="savep">Guardar peça</button><button class="btn ghost" data-a="cancel">Limpar</button></div>
  </div>
  <h3>Definições</h3>
  <div class="card">
    <label>Limite de probabilidade de chuva (%) <input id="thr" type="number" min="0" max="100" step="5"></label>
    <p style="font-size:13px;color:var(--mute);margin:8px 0 0">Só conta chuva nas horas com probabilidade igual ou acima deste valor. Chuvisco até 0,5 mm, normal até 2,5 mm, robusta acima disso.</p>
    <div class="row"><button class="btn ghost" data-a="reset">Repor as peças iniciais</button></div>
  </div>
</main>

<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),p2=n=>String(n).padStart(2,"0");
const LOCS={"Lisboa":[38.72,-9.14],"Oeiras":[38.69,-9.31],"Cascais":[38.70,-9.42],"Sintra":[38.80,-9.38],"Almada":[38.68,-9.16],"Setúbal":[38.52,-8.89]};
// t: m=camada média, o=exterior | w: vento 0/1/2 | r: chuva 0-3 | f: formalidade 1-3
const DEF=[
{n:"Sweat fina",t:"m",lo:17,hi:22,w:0,r:0,f:1},{n:"Sweat quente",t:"m",lo:12,hi:18,w:0,r:0,f:1},
{n:"1/4 zip algodão",t:"m",lo:16,hi:21,w:0,r:0,f:1},{n:"1/4 zip lã",t:"m",lo:11,hi:17,w:0,r:0,f:2},
{n:"Polartec Katmandu",t:"m",lo:9,hi:15,w:0,r:0,f:1},
{n:"Colete Scalpers",t:"o",lo:13,hi:18,w:1,r:0,f:2},{n:"Thermoball TNF",t:"o",lo:8,hi:14,w:1,r:1,f:1},
{n:"Goretex Mountain TNF",t:"o",lo:10,hi:20,w:2,r:3,f:1},{n:"Zara estilo Detroit",t:"o",lo:5,hi:12,w:2,r:0,f:1},
{n:"Encerado Springfield",t:"o",lo:10,hi:17,w:2,r:2,f:2}];
const WL=["não","parcial","sim"],RL=["sem chuva","chuvisco","normal","robusta"],P=[[6,12],[12,18],[18,24]];
const fresh=()=>DEF.map((p,i)=>({...p,id:i+1}));
let S={w:fresh(),thr:40,mode:"c",day:0,per:[1,1,1],custom:false,from:9,to:18,loc:"Lisboa",coords:null},D=null,err="",edit=null;
try{const x=JSON.parse(localStorage.getItem("ov1"));if(x&&x.w)S={...S,...x}}catch(e){}
const save=()=>{try{localStorage.setItem("ov1",JSON.stringify(S))}catch(e){}};

/* ---------- dados ---------- */
const where=()=>S.loc==="GPS"&&S.coords?S.coords:(LOCS[S.loc]||LOCS.Lisboa);
async function load(){
  const [la,lo]=where();err="";D=null;render();
  try{
    const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${la}&longitude=${lo}&hourly=apparent_temperature,wind_speed_10m,precipitation_probability,precipitation,cloud_cover,shortwave_radiation&forecast_days=2&timezone=Europe/Lisbon`);
    if(!r.ok)throw 0;D=(await r.json()).hourly;
  }catch(e){err="Não consegui ir buscar a previsão ao Open-Meteo. Verifica a ligação à internet."}
  render();
}
function demo(){
  const b=new Date();b.setHours(0,0,0,0);D={time:[],apparent_temperature:[],wind_speed_10m:[],precipitation_probability:[],precipitation:[],cloud_cover:[],shortwave_radiation:[]};
  for(let k=0;k<48;k++){const t=new Date(b.getTime()+k*36e5),h=k%24;
    D.time.push(`${t.getFullYear()}-${p2(t.getMonth()+1)}-${p2(t.getDate())}T${p2(h)}:00`);
    D.apparent_temperature.push(+(11+6*Math.sin((h-9)*Math.PI/12)).toFixed(1));
    D.wind_speed_10m.push(+(10+9*Math.abs(Math.sin(h/5))).toFixed(1));
    const wet=h>=15&&h<=18&&k<24;D.precipitation_probability.push(wet?70:10);D.precipitation.push(wet?1.2:0);
    D.cloud_cover.push(wet?90:35);D.shortwave_radiation.push(Math.max(0,Math.round(550*Math.sin((h-6)*Math.PI/12))));}
  err="";render();
}
const inWin=h=>S.custom?(h>=S.from&&h<S.to):S.per.some((on,i)=>on&&h>=P[i][0]&&h<P[i][1]);
function rows(){
  if(!D)return[];const days=[...new Set(D.time.map(t=>t.slice(0,10)))],dt=days[S.day]||days[0],o=[];
  D.time.forEach((t,i)=>{if(t.slice(0,10)!==dt)return;const h=+t.slice(11,13)+ +t.slice(14,16)/60;
    if(inWin(h))o.push({t:t.slice(11,16),f:D.apparent_temperature[i],v:D.wind_speed_10m[i],p:D.precipitation_probability[i]??0,mm:D.precipitation[i]??0,c:D.cloud_cover[i],s:D.shortwave_radiation[i]})});
  return o;
}

/* ---------- sugestões ---------- */
const extra=m=>Math.min(5,Math.max(2,(22-m.lo)*.4)); // °C a mais que uma camada média dá por baixo de um exterior
function suggest(R){
  const tmin=Math.min(...R.map(r=>r.f)),tmax=Math.max(...R.map(r=>r.f)),rmin=R.find(r=>r.f===tmin),vmax=Math.max(...R.map(r=>r.v));
  let rn=0,rr=null;R.forEach(r=>{if(r.p>=S.thr&&r.mm>0){const n=r.mm>=2.5?3:r.mm>=.5?2:1;if(n>rn){rn=n;rr=r}}});
  const wn=vmax>=30?2:vmax>=18?1:0,ok=S.mode==="c"?[1,2]:[2,3],pool=S.w.filter(p=>ok.includes(p.f));
  const pen=(lo,hi,w,r)=>{let s=0;if(tmin<lo)s+=lo-tmin;if(tmin>hi)s+=(tmin-hi)*1.5;else if(tmax>hi)s+=(tmax-hi)*.5;if(w<wn)s+=(wn-w)*4;if(r<rn)s+=(rn-r)*20;return s};
  const C=pool.map(p=>({a:p,lo:p.lo,hi:p.hi,s:pen(p.lo,p.hi,p.w,p.r)}));
  pool.filter(p=>p.t==="o").forEach(o=>pool.filter(p=>p.t==="m").forEach(m=>{const e=extra(m),lo=o.lo-e,hi=o.hi-e/2;C.push({a:o,b:m,lo,hi,s:pen(lo,hi,o.w,o.r)+1.5})}));
  C.sort((x,y)=>x.s-y.s);
  return{tmin,tmax,rmin,vmax,wn,rn,rr,C:C.slice(0,3),pool};
}
const nm=c=>c.b?`${c.a.n} com ${c.b.n} por baixo`:c.a.n;

/* ---------- ecrã ---------- */
function render(){
  $("#chips").querySelectorAll(".chip").forEach((b,i)=>b.setAttribute("aria-pressed",!S.custom&&!!S.per[i]));
  document.querySelectorAll("[data-a=day]").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.v===S.day));
  document.querySelectorAll("[data-a=mode]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===S.mode));
  const out=$("#out");
  if(err){out.innerHTML=`<div class="card err"><p>${esc(err)}</p><button class="btn ghost" data-a="retry">Tentar outra vez</button> <button class="btn ghost" data-a="demo">Ver com dados de exemplo</button></div>`;return}
  if(!D){out.innerHTML=`<p class="card">A carregar a previsão…</p>`;return}
  const R=rows();
  if(!R.length){out.innerHTML=`<p class="card">Escolhe pelo menos um período ou um intervalo de horas.</p>`;return}
  const g=suggest(R),best=g.C[0],modo=S.mode==="c"?"Casual":"Formal",tshirt=g.tmin>=23&&!g.rn;
  const hrs=`${R[0].t} às ${R[R.length-1].t}`;
  let h=`<section class="hero"><small>${modo}, das ${hrs}</small>`;
  if(!g.pool.length)h+=`<h2>Sem peças</h2><p>Não tens peças marcadas para o modo ${modo.toLowerCase()}.</p></section>`;
  else if(tshirt)h+=`<h2>T-shirt</h2><p>Nem a hora mais fria baixa dos 23 °C.</p></section>`;
  else{
    h+=`<h2>${esc(best.a.n)}</h2>${best.b?`<p>com ${esc(best.b.n)} por baixo</p>`:""}`;
    const w=[];
    if(g.rn>best.a.r)w.push(`Vai chover (${RL[g.rn]}), mas esta peça só aguenta ${RL[best.a.r]}. Não tens melhor neste modo.`);
    if(g.wn>best.a.w)w.push(`Há vento de até ${Math.round(g.vmax)} km/h e esta peça não o corta bem.`);
    if(g.tmin<best.lo-.5)w.push(`Às ${g.rmin.t} vai estar ${Math.round(best.lo-g.tmin)} °C abaixo do que a combinação aguenta.`);
    else if(g.tmin<=best.hi){const hot=R.find(r=>r.f>best.hi+2);if(hot)w.push(`A partir das ${hot.t} deves ter calor: leva a peça de cima na mão.`)}
    if(g.tmin>best.hi+2)w.push(`Esta é a peça mais leve que tens neste modo, mas deve ficar quente (mínimo de ${Math.round(g.tmin)} °C).`);
    w.forEach(x=>h+=`<div class="warn">${esc(x)}</div>`);h+="</section>";
  }
  if(g.C.length>1&&g.pool.length&&!tshirt)h+=`<h3>Alternativas</h3>`+g.C.slice(1).map(c=>`<div class="alt">${esc(nm(c))}</div>`).join("");
  const mx=k=>Math.max(...R.map(r=>r[k])),cm=Math.round(R.reduce((a,r)=>a+r.c,0)/R.length);
  h+=`<h3>Condições</h3><dl><div><dt>Sensação térmica</dt><dd>${Math.round(g.tmin)} a ${Math.round(g.tmax)} °C</dd><dd>mais frio às ${g.rmin.t}</dd></div>
  <div><dt>Vento médio</dt><dd>até ${Math.round(g.vmax)} km/h</dd><dd>${g.wn===2?"forte, peça corta-vento":g.wn===1?"moderado, ajuda corta-vento":"fraco"}</dd></div>
  <div><dt>Chuva</dt><dd>${mx("mm").toFixed(1).replace(".",",")} mm</dd><dd>probabilidade até ${Math.round(mx("p"))}%${g.rn?`, impermeável ${RL[g.rn]} às ${g.rr.t}`:""}</dd></div>
  <div><dt>Sol</dt><dd>${Math.round(mx("s"))} W/m²</dd><dd>céu ${cm}% nublado; já está contado na sensação térmica</dd></div></dl>`;
  h+=`<h3>Hora a hora</h3><div class="strip">`+R.map(r=>`<div class="cell${r.mm>0&&r.p>=S.thr?" wet":""}">${r.t}<b>${Math.round(r.f)}°</b>${Math.round(r.v)} km/h<br>${r.mm.toFixed(1).replace(".",",")} mm</div>`).join("")+`</div>`;
  out.innerHTML=h;
}
function renderWard(){
  const T={o:"exterior",m:"camada média"};
  $("#list").innerHTML=S.w.map(p=>`<div class="card piece"><div><b>${esc(p.n)}</b><p>${p.lo} a ${p.hi} °C, ${T[p.t]}</p><p>vento ${WL[p.w]}, chuva ${RL[p.r]}, formalidade ${p.f}</p></div><div><button class="mini" data-a="edit" data-v="${p.id}">Editar</button><button class="mini" data-a="del" data-v="${p.id}">Apagar</button></div></div>`).join("")||`<p class="card">Ainda não tens peças. Adiciona a primeira em baixo.</p>`;
  $("#thr").value=S.thr;
}
function fillForm(p){
  edit=p?p.id:null;$("#ftitle").textContent=p?"Editar peça":"Adicionar peça";
  $("#fn").value=p?p.n:"";$("#ft").value=p?p.t:"o";$("#flo").value=p?p.lo:"";$("#fhi").value=p?p.hi:"";$("#fw").value=p?p.w:0;$("#fr").value=p?p.r:0;$("#ff").value=p?p.f:1;
}

/* ---------- ações ---------- */
const A={
  tab(v){$("#v-today").hidden=v!=="today";$("#v-ward").hidden=v!=="ward";document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===v));if(v==="ward")renderWard()},
  day(v){S.day=+v;save();render()},mode(v){S.mode=v;save();render()},
  per(v){if(S.custom){S.custom=false;S.per=[0,0,0]}S.per[+v]=S.per[+v]?0:1;save();render()},
  gps(){navigator.geolocation?.getCurrentPosition(pos=>{S.coords=[+pos.coords.latitude.toFixed(3),+pos.coords.longitude.toFixed(3)];S.loc="GPS";save();locSel();load()},()=>{err="Não consegui obter a localização. Escolhe uma zona da lista.";render()})},
  demo,retry:load,
  edit(v){fillForm(S.w.find(p=>p.id==v));scrollTo({top:document.body.scrollHeight,behavior:"smooth"})},
  del(v){S.w=S.w.filter(p=>p.id!=v);save();renderWard()},
  cancel(){fillForm(null)},
  reset(){if(confirm("Repor as 10 peças iniciais? As tuas alterações perdem-se.")){S.w=fresh();save();renderWard();fillForm(null)}},
  savep(){
    const n=$("#fn").value.trim(),lo=parseFloat($("#flo").value),hi=parseFloat($("#fhi").value);
    if(!n||isNaN(lo)||isNaN(hi)||lo>hi){alert("Preenche o nome e um intervalo válido (desde ≤ até).");return}
    const o={n,t:$("#ft").value,lo,hi,w:+$("#fw").value,r:+$("#fr").value,f:+$("#ff").value};
    if(edit){S.w=S.w.map(p=>p.id===edit?{...o,id:edit}:p)}else{S.w.push({...o,id:Math.max(0,...S.w.map(p=>p.id))+1})}
    save();renderWard();fillForm(null);
  }
};
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset.v)});
const hrOpts=()=>Array.from({length:25},(_,i)=>`<option value="${i}">${p2(i)}:00</option>`).join("");
$("#from").innerHTML=$("#to").innerHTML=hrOpts();
const locSel=()=>{$("#loc").innerHTML=Object.keys(LOCS).map(k=>`<option>${k}</option>`).join("")+(S.coords?`<option value="GPS">A minha localização</option>`:"");$("#loc").value=S.loc};
$("#from").value=S.from;$("#to").value=S.to;locSel();
["from","to"].forEach(id=>$("#"+id).addEventListener("change",()=>{S.custom=true;S.from=+$("#from").value;S.to=+$("#to").value;save();render()}));
$("#loc").addEventListener("change",()=>{S.loc=$("#loc").value;save();load()});
$("#thr").addEventListener("change",()=>{S.thr=Math.min(100,Math.max(0,+$("#thr").value||0));save()});
function forest(){
  let h="";
  [["#9db8aa",.55,112,24],["#58806f",.8,142,30],["#24473f",1.15,178,40]].forEach(([c,k,y,gap],L)=>{
    h+=`<rect y="${y+26*k-2}" width="640" height="200" fill="${c}"/><g fill="${c}">`;
    for(let x=-8+L*11,i=0;x<660;i++){const sc=k*(.85+((i*53+L*7)%30)/100);h+=`<use href="#pine" transform="translate(${x},${y}) scale(${sc.toFixed(2)})"/>`;x+=gap+((i*37+L*11)%12)}
    h+="</g>"});
  $("#trees").innerHTML=h;
}
forest();render();load();
</script>
